name: Build native apps

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows
        run: npm run app:windows
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: liste-ethan-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install dependencies
        run: npm install
      - name: Prepare Android toolchain
        run: |
          npm run native:prepare
          npx tauri android init
      - name: Build Android APK
        run: npx tauri android build --apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: liste-ethan-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Prepare iOS project
        run: |
          npm run native:prepare
          npx tauri ios init
      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: liste-ethan-ios-project
          path: app/src-tauri/gen/apple
