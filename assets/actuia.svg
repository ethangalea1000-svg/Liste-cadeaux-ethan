<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">ActuIA — Le magazine de l'intelligence artificielle</title>
  <desc id="desc">Visuel éditorial du magazine ActuIA, dédié à l'intelligence artificielle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset=".52" stop-color="#182d72"/>
      <stop offset="1" stop-color="#5d2f9f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69e8ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="750" rx="36" fill="url(#bg)"/>
