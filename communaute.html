<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Communauté — La liste d’Ethan</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#151827;--muted:#6b7280;--line:#e6e8ef;--accent:#5b5ce2;--shadow:0 10px 30px rgba(20,25,50,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}a{color:inherit}.hero{padding:28px 20px;background:linear-gradient(135deg,#17192a,#393b73);color:#fff}.wrap{max-width:900px;margin:auto}.hero-row{display:flex;justify-content:space-between;gap:15px;align-items:center}.back{background:#ffffff1f;padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:700}.panel{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.form textarea{min-height:90px;resize:vertical}.send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer}.note{font-size:12px;color:var(--muted)}.posts{display:grid;gap:12px;margin-top:18px}.post{border:1px solid var(--line);border-radius:14px;padding:15px}.meta{font-size:12px;color:var(--muted);margin-bottom:6px}.message{white-space:pre-wrap;line-height:1.5}.reactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.reaction{border:1px solid var(--line);background:#f8f8fb;border-radius:999px;padding:7px 10px;cursor:pointer}.danger{border:1px solid #f0c8c8;background:#fff0f0;color:#a33;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:700}.post-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:20px}.toast{position:fixed;right:18px;bottom:18px;background:#17192a;color:#fff;padding:12px 14px;border-radius:12px;opacity:0;transition:.2s}.toast.show{opacity:1}
</style>
</head>
<body>
<header class="hero"><div class="wrap hero-row"><div><strong>💬 Communauté</strong><div style="margin-top:6px;color:#e8e9f2">Discutez, partagez vos idées et réagissez aux messages.</div></div><a class="back" href="index.html">← Liste</a></div></header>
<main class="wrap">
<section class="panel">
<h2>Écrire un message</h2>
<form id="postForm" class="form">
<input id="name" maxlength="50" required placeholder="Ton prénom *">
<textarea id="message" maxlength="500" required placeholder="Ton message *"></textarea>
<button class="send" type="submit">Publier</button>
<div class="note">Les messages de cette page sont publics. Pour supprimer ton message ou ta réaction, le prénom utilisé doit être vérifié.</div>
</form>
</section>
<section class="panel">
<h2>Discussion</h2>
<div id="posts" class="posts"></div>
</section>
</main>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://ckasbsnzxgwfwfnctioe.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_e9u2wbkr12SRgxPDIB-EkA_I4QnQsF4";
const postsEl=document.getElementById("posts"),toast=document.getElementById("toast");
function showToast(m){toast.textContent=m;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){
 const [pr,rr]=await Promise.all([
  fetch(SUPABASE_URL+"/rest/v1/community_posts?select=id,name,message,created_at&order=created_at.desc&limit=50",{cache:"no-store",headers:{apikey:SUPABASE_ANON_KEY,Accept:"application/json"}}),
  fetch(SUPABASE_URL+"/rest/v1/community_reactions?select=post_id,emoji,name",{cache:"no-store",headers:{apikey:SUPABASE_ANON_KEY,Accept:"application/json"}})
 ]);
 if(!pr.ok){postsEl.innerHTML='<div class="empty">Impossible de charger la discussion.</div>';return}
 const posts=await pr.json(), reactions=rr.ok?await rr.json():[];
 const counts={};
 reactions.forEach(r=>{counts[r.post_id]??={};counts[r.post_id][r.emoji]=(counts[r.post_id][r.emoji]||0)+1});
 postsEl.innerHTML="";
 if(!posts.length){postsEl.innerHTML='<div class="empty">Aucun message pour le moment.</div>';return}
 posts.forEach(p=>{
  const c=counts[p.id]||{};
  const box=document.createElement("article");box.className="post";
  box.innerHTML='<div class="meta"><strong>'+esc(p.name)+'</strong> · '+new Date(p.created_at).toLocaleString("fr-FR")+'</div><div class="message">'+esc(p.message)+'</div><div class="reactions">'+["❤️","👍","😂","🎉","😮"].map(e=>'<button class="reaction" data-e="'+e+'">'+e+' '+(c[e]||0)+'</button>').join("")+'</div><div class="post-actions"><button class="danger delete-post">Supprimer ce message</button></div>';
  box.querySelectorAll(".reaction").forEach(b=>b.onclick=()=>toggleReaction(p.id,b.dataset.e));
  box.querySelector(".delete-post").onclick=()=>deletePost(p.id,p.name);
  postsEl.appendChild(box);
 });
}
async function toggleReaction(postId,emoji){
  const name=prompt("Pour ajouter ou retirer cette réaction, écris ton prénom :")?.trim();
  if(!name)return;
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/toggle_reaction",{
    method:"POST",cache:"no-store",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({p_post_id:postId,p_emoji:emoji,p_name:name})
  });
  if(!r.ok){console.error("toggle reaction",r.status,await r.text());showToast("Réaction impossible ("+r.status+").");return}
  const result=await r.json().catch(()=>null);
  showToast(result==="removed"?"Réaction retirée.":"Réaction ajoutée.");
  load();
}
async function deletePost(postId,currentName){
  const name=prompt("Pour supprimer ce message, écris le prénom utilisé lors de sa publication :")?.trim();
  if(!name)return;
  if(name.toLowerCase()!==currentName.toLowerCase()){showToast("Le prénom ne correspond pas.");return}
  if(!confirm("Supprimer ce message ?"))return;
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/delete_community_post",{
    method:"POST",cache:"no-store",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({p_id:postId,p_name:name})
  });
  if(!r.ok){console.error("delete post",r.status,await r.text());showToast("Suppression impossible ("+r.status+").");return}
  showToast("Message supprimé.");
  load();
}
document.getElementById("postForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const body={name:document.getElementById("name").value.trim(),message:document.getElementById("message").value.trim()};
 const r=await fetch(SUPABASE_URL+"/rest/v1/community_posts",{method:"POST",cache:"no-store",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(body)});
 if(!r.ok){showToast("Impossible de publier.");return}
 document.getElementById("postForm").reset();showToast("Message publié.");load();
});
load();setInterval(load,5000);
</script>
</body>
</html>
